[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autorepair-knowledge-pipeline"
version = "0.6.0"
description = "Traceable automotive document processing with brand rules and quality gates"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "pydantic>=2.10,<3",
  "PyYAML>=6,<7", "rank-bm25>=0.2.2,<0.3", "streamlit>=1.45,<2",
]

[project.optional-dependencies]
docling = [
    "docling>=2.70,<3",
    "httpx[socks]>=0.28,<1",
    "onnxruntime>=1.20,<2",
    "pdfplumber>=0.11,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "python-docx>=1.1,<2",
    "reportlab>=4,<5",
    "pillow>=11,<13",
    "markdown-it-py>=3,<5",
]

[project.scripts]
autorepair = "autorepair.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autorepair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docling: conversion requiring optional Docling dependency and PDF model cache"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Ruff formatter preserves long prose, regex and HTML fixture literals.
[tool.ruff.lint.per-file-ignores]
"*.py" = ["E501"]
