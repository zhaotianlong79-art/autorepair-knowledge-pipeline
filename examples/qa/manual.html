<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>自制点火系统演示资料</title></head><body>
<h1>点火系统维修演示</h1>
<h2>火花塞安装</h2>
<p>火花塞安装扭矩为 42 Nm。本数据仅为软件测试示例。</p>
<ol><li>清洁火花塞座孔，检查螺纹。</li><li>先用手旋入火花塞，再使用扭矩扳手拧紧。</li></ol>
<p>警告：必须待发动机冷却；禁止强行拧入火花塞。</p>
<table><tr><th>项目</th><th>演示数值</th></tr><tr><td>火花塞间隙</td><td>0.8 mm</td></tr></table>
<h2>故障诊断</h2><p>故障码 P0300 表示随机或多缸失火，应检查火花塞和点火线圈。</p>
</body></html>
